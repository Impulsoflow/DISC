name: Validar versão do formulário
on:
  push:
  pull_request:
jobs:
  versao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conferir versão visível, metadata e arquivo
        run: node scripts/check-form-version.cjs
      - name: Exigir nova versão quando o formulário muda
        run: node scripts/check-release-bump.cjs
